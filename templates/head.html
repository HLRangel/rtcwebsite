<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ifdef title \ {{ var title }} | }} {{ var name }}</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
    <link rel="manifest" href="/assets/images/site.webmanifest">
    <link rel="shortcut icon" href="/assets/images/favicon.ico">

    <meta name="twitter:site" content="RTC">
    <meta name="theme-color" content="#BF241F">
    
    <meta property="og:url" content="{{ var url }}">

    {{ ifdef title 
        <meta property="og:title" content="{{ var title }}">
        <meta name="twitter:title" content="{{ var title }}">
    }}
    
    {{ ifdef description 
        <meta property="og:description" content="{{ var description }}"/>
        <meta name="twitter:description" content="{{ var description }}">
    }}

    {{ ifdef page_image
        <meta name="twitter:card" content="summary_large_image">
        <meta property="og:image" content="{{ var url }}{{ var page_image }}">
        <meta name="twitter:image:src" content="{{ var url }}{{ var page_image }}">
    }}

    <meta property="og:site_name" content="{{ var name }}">

    <link rel="stylesheet" href="/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Knewave&display=swap" rel="stylesheet">
</head>
